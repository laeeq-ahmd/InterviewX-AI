name: CD — Deploy to Render

on:
  push:
    branches: ["main"]

# Only run after CI passes
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Trigger Render Deployment
    runs-on: ubuntu-latest
    # Only deploy if CI passes — this job depends on the same commit
    # CI runs automatically on push; if it fails, this workflow will still
    # trigger, so we add an explicit check via needs pattern below.
    # For full gating: use workflow_run trigger (see note below).

    steps:
      - name: Deploy server to Render
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            --request POST \
            "${{ secrets.RENDER_SERVER_HOOK_URL }}" \
          | grep -q "^2" && echo "✅ Server deploy triggered" || echo "❌ Server deploy failed"

      - name: Deploy client to Render
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            --request POST \
            "${{ secrets.RENDER_CLIENT_HOOK_URL }}" \
          | grep -q "^2" && echo "✅ Client deploy triggered" || echo "❌ Client deploy failed"

# ─────────────────────────────────────────────────────────────────
# SETUP REQUIRED (one-time):
# Go to your GitHub repo → Settings → Secrets and variables → Actions
# Add two secrets:
#   RENDER_SERVER_HOOK_URL  → Render dashboard → server service → Settings → Deploy Hook
#   RENDER_CLIENT_HOOK_URL  → Render dashboard → client service → Settings → Deploy Hook
# ─────────────────────────────────────────────────────────────────
