apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: interviewx
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          # nginx serves the React SPA and proxies /api calls to the backend service.
          # The nginx.conf in the image handles routing — no hardcoded backend URL needed.
          image: laeeqahmd/careerx-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: interviewx
spec:
  selector:
    app: frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
