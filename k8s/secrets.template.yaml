# ─────────────────────────────────────────────────────────────────────────────
# CareerX AI — Kubernetes Secrets Template
# ─────────────────────────────────────────────────────────────────────────────
# STEP 1: Copy this file:
#   cp k8s/secrets.template.yaml k8s/secrets.yaml
#
# STEP 2: Fill in all your real values below.
#
# STEP 3: Apply before deploying:
#   kubectl apply -f k8s/secrets.yaml
#
# ⚠  k8s/secrets.yaml is in .gitignore and will NEVER be committed to GitHub.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  namespace: interviewx
type: Opaque
stringData:
  MONGODB_URL: "your_mongodb_connection_string"
  JWT_SECRET: "any_long_random_string_for_signing_tokens"
  OPENROUTER_API_KEY: "sk-or-v1-your_openrouter_key"
  RAZORPAY_KEY_ID: "rzp_test_your_key_id"
  RAZORPAY_KEY_SECRET: "your_razorpay_key_secret"
  CLIENT_URL: "http://careerx.local"
  NODE_ENV: "production"
