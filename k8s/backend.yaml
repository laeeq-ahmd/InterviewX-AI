apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: interviewx
data:
  PORT: "8000"
  CHROMA_URL: "http://chromadb-service:8001"
---
# Secrets are NOT stored here.
# Apply them separately before deploying:
#   kubectl apply -f k8s/secrets.yaml   (copied from secrets.template.yaml)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: interviewx
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: laeeqahmd/careerx-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secrets
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: interviewx
spec:
  selector:
    app: backend
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
