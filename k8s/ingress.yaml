apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: interviewx-ingress
  namespace: interviewx
  annotations:
    kubernetes.io/ingress.class: "traefik"
    # To enable HTTPS later with Let's Encrypt / Cert-Manager
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  rules:
    # Replace with your actual EC2 public DNS / elastic IP / domain
    - host: interviewx.yourdomain.com 
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
