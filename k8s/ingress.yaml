apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: interviewx-ingress
  namespace: interviewx
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    # Locally: add "$(minikube ip) careerx.local" to /etc/hosts
    # See k8s/deploy-local.sh for the automated one-command setup
    - host: careerx.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
