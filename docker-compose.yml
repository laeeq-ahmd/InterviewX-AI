services:
  chromadb:
    image: chromadb/chroma:latest
    container_name: interviewx_chromadb
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: interviewx_server
    ports:
      - "8000:8000"
    # server/.env is loaded at runtime for all backend secrets
    env_file:
      - ./server/.env
    environment:
      # Non-secret service-to-service override — safe to have here
      CHROMA_URL: "http://chromadb:8000"
    depends_on:
      - chromadb
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        # Docker Compose reads these from the root .env file automatically.
        # VITE_SERVER_URL: empty = nginx proxies /api. Set to your domain on EC2.
        VITE_SERVER_URL: "${VITE_SERVER_URL:-}"
        VITE_FIREBASE_APIKEY: "${VITE_FIREBASE_APIKEY}"
        VITE_RAZORPAY_KEY_ID: "${VITE_RAZORPAY_KEY_ID}"
    container_name: interviewx_client
    ports:
      - "80:80"
    depends_on:
      server:
        condition: service_healthy

volumes:
  chroma_data:
